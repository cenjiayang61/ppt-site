<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPT 展示站</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #161616;
      --muted: #666b73;
      --line: #d9dde3;
      --paper: #f7f4ee;
      --panel: #ffffff;
      --accent: #1f65ff;
      --accent-2: #ffb000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(22, 22, 22, 0.04) 1px, transparent 1px),
        linear-gradient(180deg, rgba(22, 22, 22, 0.04) 1px, transparent 1px),
        var(--paper);
      background-size: 48px 48px;
    }

    header {
      padding: 56px clamp(20px, 6vw, 72px) 24px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--accent);
      text-transform: uppercase;
    }

    h1 {
      max-width: 880px;
      margin: 0;
      font-size: clamp(36px, 7vw, 86px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .intro {
      max-width: 720px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    main {
      padding: 28px clamp(20px, 6vw, 72px) 72px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .count {
      color: var(--ink);
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .status {
      display: grid;
      min-height: 180px;
      place-items: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.55);
      border: 1px dashed var(--line);
      border-radius: 8px;
      line-height: 1.7;
      text-align: center;
    }

    .card {
      display: grid;
      min-height: 220px;
      padding: 22px;
      color: inherit;
      text-decoration: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 18px 42px rgba(20, 30, 45, 0.12);
    }

    .tag {
      width: fit-content;
      height: 28px;
      padding: 5px 10px;
      color: #111;
      background: var(--accent-2);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .card h2 {
      align-self: end;
      margin: 56px 0 10px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    footer {
      padding: 24px clamp(20px, 6vw, 72px);
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">GitHub Pages</p>
    <h1>PPT 展示站</h1>
    <p class="intro">这里可以集中展示你生成的网页 PPT。把新的 HTML 文件上传到仓库后，更新下面的卡片链接，就能把阅读地址发给别人。</p>
  </header>

  <main>
    <div class="toolbar">
      <span>全部作品</span>
      <span><strong class="count" id="ppt-count">0</strong> 个页面</span>
    </div>

    <section class="grid" id="ppt-list" aria-label="PPT 列表">
      <div class="status">正在读取 PPT 列表...</div>
    </section>
  </main>

  <footer>
    Powered by GitHub Pages. 上传新的 HTML 后，访问地址通常是 https://你的用户名.github.io/仓库名/文件路径。
  </footer>

  <script>
    const repo = "cenjiayang61/ppt-site";
    const branch = "main";
    const apiUrl = `https://api.github.com/repos/${repo}/contents/ppts?ref=${branch}`;
    const list = document.getElementById("ppt-list");
    const count = document.getElementById("ppt-count");

    function titleFromName(name) {
      return decodeURIComponent(name)
        .replace(/\.html$/i, "")
        .replace(/_HTML项目$/i, "")
        .replace(/[-_]+/g, " ")
        .trim();
    }

    function hrefFromPath(path, type) {
      const encoded = path.split("/").map(encodeURIComponent).join("/");
      return type === "dir" ? `${encoded}/` : encoded;
    }

    function render(items) {
      const ppts = items
        .filter((item) => item.type === "dir" || /\.html$/i.test(item.name))
        .sort((a, b) => a.name.localeCompare(b.name, "zh-Hans-CN"));

      count.textContent = String(ppts.length);

      if (!ppts.length) {
        list.innerHTML = '<div class="status">还没有上传 PPT。把 HTML 或 PPT 文件夹放进 ppts/ 后，这里会自动出现。</div>';
        return;
      }

      list.innerHTML = ppts.map((item) => {
        const title = titleFromName(item.name);
        const href = hrefFromPath(item.path, item.type);
        const tag = item.type === "dir" ? "Folder" : "HTML";
        const desc = item.type === "dir"
          ? "包含 index.html 和资源文件的完整网页 PPT。"
          : "单文件 HTML 网页 PPT。";

        return `
          <a class="card" href="${href}">
            <span class="tag">${tag}</span>
            <h2>${title}</h2>
            <p>${desc}</p>
          </a>
        `;
      }).join("");
    }

    fetch(apiUrl, { headers: { "Accept": "application/vnd.github+json" } })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(render)
      .catch(() => {
        list.innerHTML = '<div class="status">暂时无法读取列表。请稍后刷新，或直接访问 ppts 文件夹里的 PPT 链接。</div>';
      });
  </script>
</body>
</html>
