<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>示例 PPT</title>
  <style>
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      color: #111;
      background: #f7f4ee;
    }

    main {
      max-width: 820px;
      padding: 48px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(40px, 7vw, 88px);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #5f6670;
      font-size: 20px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>示例 PPT</h1>
    <p>把这里替换成你用 guizang-ppt-skill 生成的 HTML，或者直接把生成好的 HTML 上传到 ppts 文件夹。</p>
  </main>
</body>
</html>
